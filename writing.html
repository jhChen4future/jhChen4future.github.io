<section class="prose-page shell">
  <h1>Posts</h1>
  {% if site.posts.size > 0 %}
  <ul class="post-list" role="list">
    {% for post in site.posts %}
    <li><a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></li>
    {% endfor %}
  </ul>
  {% endif %}
</section>
