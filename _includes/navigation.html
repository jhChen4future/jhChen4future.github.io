<header class="site-header" data-site-header>
  <div class="shell header-inner">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} - home">
      {{ site.data.profile.name }}
    </a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-navigation">
      Menu
    </button>

    <nav class="site-nav" id="site-navigation" aria-label="Primary navigation">
      {% for item in site.data.navigation %}
        {% assign item_url = item.url %}
        {% if item.profile_url %}{% assign item_url = site.data.profile[item.profile_url] %}{% endif %}
        <a href="{% if item.external %}{{ item_url }}{% else %}{{ item_url | relative_url }}{% endif %}"{% if item.external %} target="_blank" rel="noreferrer"{% endif %}{% if page.nav == item.key %} aria-current="page"{% endif %}>{{ item.label }}</a>
      {% endfor %}
      <button class="theme-toggle" type="button" aria-label="Dark theme" aria-pressed="false" title="Switch color theme">
        <span class="theme-toggle-sun" aria-hidden="true">&#9728;</span>
        <span class="theme-toggle-moon" aria-hidden="true">&#9680;</span>
      </button>
    </nav>
  </div>
</header>
