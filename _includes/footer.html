<footer class="site-footer">
  <div class="shell footer-grid">
    <p class="footer-meta">&copy; <span data-current-year>{{ site.time | date: '%Y' }}</span> <a href="{{ '/' | relative_url }}">{{ site.data.profile.name }}</a></p>
    <div class="footer-links" aria-label="Social links">
      <a href="mailto:{{ site.data.profile.email }}">Email <span aria-hidden="true">&nearr;</span></a>
      <a href="{{ site.data.profile.github }}" target="_blank" rel="noreferrer">GitHub <span aria-hidden="true">&nearr;</span></a>
    </div>
  </div>
</footer>
