---
layout: default
nav: home
title: Jinghao Chen
description: Behavioral economics, prosocial behavior, cooperation, and the potential of large language models in social science.
---
{% assign profile = site.data.profile %}

<div class="home-content shell">
  <div class="home-profile">
    <div class="home-intro">
      <p>{{ profile.intro }}</p>
      <ul class="home-links" role="list" aria-label="Academic and contact links">
        <li><a href="{{ profile.cv_url }}" target="_blank" rel="noreferrer">CV <span aria-hidden="true">&nearr;</span></a></li>
        <li><a href="mailto:{{ profile.email }}">{{ profile.email }}</a></li>
      </ul>
    </div>
    <img class="home-portrait" src="{{ profile.portrait | relative_url }}" alt="{{ profile.name }}" width="1200" height="1500">
  </div>
</div>
