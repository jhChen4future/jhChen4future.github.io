---
layout: default
nav: writing
---
<article class="prose-page shell narrow-shell">
  <header class="page-heading post-heading reveal">
    <a class="back-link" href="{{ '/writing/' | relative_url }}">&larr; All posts</a>
    <h1>{{ page.title | escape }}</h1>
  </header>
  <div class="prose reveal">
    {{ content }}
  </div>
  <p class="post-date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
</article>
